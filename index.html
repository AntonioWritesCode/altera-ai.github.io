<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sol</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

  <div class="layout">
    <div class="tabs" id="tabs">
      <button type="button" id="tabs-toggle" aria-label="Collapse sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 5 8 12l7 7" />
        </svg>
      </button>
      <ul>
        <li class="tab active">
          <a href="/">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 5h16v11H8l-4 4V5Z" />
            </svg>
            <span class="tab-label">New chat</span>
          </a>
        </li>
        <li class="tab">
          <a href="/html/journal.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H17a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6.5A1.5 1.5 0 0 1 5 19.5v-15Z" />
              <path d="M5 6.5h13M5 17.5h13" />
            </svg>
            <span class="tab-label">Journal</span>
          </a>
        </li>
        <li class="tab">
          <a href="">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20v-6M12 4v6M4 12h16M4 12l4-4M4 12l4 4M20 12l-4-4M20 12l-4 4" />
            </svg>
            <span class="tab-label">Report</span>
          </a>
        </li>
    </div>

    <div class="main" id="main">
      <div class="glow" aria-hidden="true"></div>

      <header id="hero">
        <h1 id="greeting">Hello.</h1>
        <p class="subhead">What's on your mind today?</p>
      </header>

      <div class="chat-log" id="chat-log"></div>

      <div class="composer">
        <div class="typebar">
          <textarea id="composer-input" rows="1" placeholder="Type your message..."></textarea>
          <button type="button" id="send-btn" aria-label="Send message">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 19V5M12 5L5 12M12 5L19 12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <p class="disclaimer">Sol is not a therapist and still under development. Information may be wrong.</p>
      </div>
    </div>
  </div>

  <script>
    const tabs = document.getElementById('tabs');
    const toggleBtn = document.getElementById('tabs-toggle');

    toggleBtn.addEventListener('click', () => {
      const collapsed = tabs.classList.toggle('collapsed');
      toggleBtn.setAttribute('aria-label', collapsed ? 'Expand sidebar' : 'Collapse sidebar');
    });

    // Greeting that follows the time of day, fitting for an app named Sol
    const greetingEl = document.getElementById('greeting');
    const hour = new Date().getHours();
    const greeting =
      hour < 5 ? 'Still up?' :
      hour < 12 ? 'Good morning.' :
      hour < 18 ? 'Good afternoon.' :
      'Good evening.';
    greetingEl.textContent = greeting;
  </script>
  <script src="/js/chat.js"></script>

</body>
</html>
